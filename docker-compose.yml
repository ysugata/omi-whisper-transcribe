services:
  omi-whisper:
    build: .
    container_name: omi-whisper-transcribe
    ports:
      - "${PORT:-8090}:${PORT:-8090}"
      - "${MANAGEMENT_PORT:-8091}:${MANAGEMENT_PORT:-8091}"
    volumes:
      - whisper-models:/models
      - ./recordings:/app/recordings
      - ./config:/app/config
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - HF_HOME=/models
      - CONFIG_DIR=/app/config
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - COMPUTE_TYPE=${COMPUTE_TYPE:-int8_float16}
      - LANGUAGE=${LANGUAGE:-ja}
      - BEAM_SIZE=${BEAM_SIZE:-5}
      - VAD_FILTER=${VAD_FILTER:-true}
      - BUFFER_SECONDS=${BUFFER_SECONDS:-5.0}
      - INITIAL_PROMPT=${INITIAL_PROMPT:-}
      - NO_REPEAT_NGRAM_SIZE=${NO_REPEAT_NGRAM_SIZE:-5}
      - PATIENCE=${PATIENCE:-1.5}
      - LOG_PROB_THRESHOLD=${LOG_PROB_THRESHOLD:--0.5}
      - NO_SPEECH_THRESHOLD=${NO_SPEECH_THRESHOLD:-0.6}
      - COMPRESSION_RATIO_THRESHOLD=${COMPRESSION_RATIO_THRESHOLD:-2.4}
      - CONDITION_ON_PREVIOUS_TEXT=${CONDITION_ON_PREVIOUS_TEXT:-true}
      - REPETITION_PENALTY=${REPETITION_PENALTY:-1.1}
      - HALLUCINATION_SILENCE_THRESHOLD=${HALLUCINATION_SILENCE_THRESHOLD:-1.0}
      - PROMPT_CARRY_ENABLED=${PROMPT_CARRY_ENABLED:-false}
      - WHISPER_VAD_MIN_SPEECH_MS=${WHISPER_VAD_MIN_SPEECH_MS:-}
      - WHISPER_VAD_MIN_SILENCE_MS=${WHISPER_VAD_MIN_SILENCE_MS:-500}
      - WHISPER_VAD_SPEECH_PAD_MS=${WHISPER_VAD_SPEECH_PAD_MS:-200}
      - WHISPER_VAD_THRESHOLD=${WHISPER_VAD_THRESHOLD:-0.5}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite-preview}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-10}
      - LLM_MIN_TEXT_LENGTH=${LLM_MIN_TEXT_LENGTH:-20}
      - LLM_PIPELINE_STAGES=${LLM_PIPELINE_STAGES:-AB}
      - STAGE_C_AUTO=${STAGE_C_AUTO:-true}
      - LLM_BATCH_MODE=${LLM_BATCH_MODE:-sync}
      - DIARIZATION_ENABLED=${DIARIZATION_ENABLED:-false}
      - HF_AUTH_TOKEN=${HF_AUTH_TOKEN:-}
      - SAVE_AUDIO=${SAVE_AUDIO:-true}
      - MAX_RECORDING_DAYS=${MAX_RECORDING_DAYS:-30}
      - NORMALIZE_ENABLED=${NORMALIZE_ENABLED:-true}
      - NORMALIZE_TARGET_DBFS=${NORMALIZE_TARGET_DBFS:--16.0}
      - NOISE_REDUCE_ENABLED=${NOISE_REDUCE_ENABLED:-false}
      - NOISE_REDUCE_PROP_DECREASE=${NOISE_REDUCE_PROP_DECREASE:-0.8}
      - VAD_SEG_ENABLED=${VAD_SEG_ENABLED:-true}
      - VAD_CHECK_INTERVAL=${VAD_CHECK_INTERVAL:-1.0}
      - VAD_SILENCE_TRIGGER=${VAD_SILENCE_TRIGGER:-1.2}
      - VAD_MAX_BUFFER=${VAD_MAX_BUFFER:-20.0}
      - VAD_THRESHOLD=${VAD_THRESHOLD:-0.5}
      - VAD_MIN_SILENCE_MS=${VAD_MIN_SILENCE_MS:-500}
      - VAD_SPEECH_PAD_MS=${VAD_SPEECH_PAD_MS:-300}
      - SILENCE_THRESHOLD=${SILENCE_THRESHOLD:-200}
      - SILENCE_TIMEOUT=${SILENCE_TIMEOUT:-30.0}
      - HOTWORDS_ENABLED=${HOTWORDS_ENABLED:-true}
      - VOICE_FILTER_ENABLED=${VOICE_FILTER_ENABLED:-false}
      - VOICE_FILTER_THRESHOLD=${VOICE_FILTER_THRESHOLD:-0}
      - TAGGING_ENABLED=${TAGGING_ENABLED:-true}
      - TAGGING_MODEL=${TAGGING_MODEL:-gemini-3.1-flash-lite-preview}
      - NIGHTLY_SCHEDULE_HOUR=${NIGHTLY_SCHEDULE_HOUR:-4}
      - SANITIZE_MODEL=${SANITIZE_MODEL:-gemini-2.5-flash}
      - SANITIZE_USE_RESPONSES_API=${SANITIZE_USE_RESPONSES_API:-auto}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-low}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-1800}
      - OPENAI_TIMEOUT_MS=${OPENAI_TIMEOUT_MS:-60000}
      - ENGINE=${ENGINE:-whisper}
      - VIBEVOICE_ENABLED=${VIBEVOICE_ENABLED:-false}
      - AUDIO_SCENE_ENABLED=${AUDIO_SCENE_ENABLED:-true}
      - AUDIO_SCENE_DEVICE=${AUDIO_SCENE_DEVICE:-cpu}
      - AUDIO_SCENE_THRESHOLD=${AUDIO_SCENE_THRESHOLD:-0.3}
      - OMI_WHISPER_TOKEN=${OMI_WHISPER_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  omi-recordings-viewer:
    build: ./omi-recordings-viewer
    container_name: omi-recordings-viewer
    ports:
      - "${VIEWER_PORT:-8092}:8092"
    volumes:
      - ./recordings:/app/recordings
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - RECORDINGS_DIR=/app/recordings
      - CONFIG_DIR=/app/config
      - DB_PATH=/app/data/index.db
      - BRIDGE_MGMT_URL=http://omi-whisper-transcribe:${MANAGEMENT_PORT:-8091}
    restart: unless-stopped

volumes:
  whisper-models:
