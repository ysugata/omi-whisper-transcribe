<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omi Recordings</title>
    <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
    <header>
        <h1>Omi Recordings</h1>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search transcripts...">
            <button id="search-btn">Search</button>
        </div>
        <button id="diarize-btn" class="diarize-btn hidden" title="Batch Speaker Diarization">Diarize</button>
        <button id="settings-btn" class="settings-btn" title="Settings">&#9881;</button>
    </header>

    <main>
        <div id="diarize-panel" class="diarize-panel hidden">
            <div class="diarize-header">
                <span id="diarize-status-text">Processing...</span>
                <span id="diarize-progress-text">0 / 0</span>
                <button id="diarize-cancel-btn" class="btn-sm btn-danger">Cancel</button>
            </div>
            <div class="progress-bar">
                <div id="diarize-progress-fill" class="progress-fill"></div>
            </div>
            <div id="diarize-current" class="text-dim"></div>
        </div>

        <div id="session-list" class="session-list">
            <div class="loading">Loading...</div>
        </div>

        <div id="pagination" class="pagination"></div>
    </main>

    <!-- Speaker tag progress panel -->
    <div id="tag-panel" class="diarize-panel hidden">
        <div class="diarize-header">
            <span id="tag-status-text">Processing...</span>
            <span id="tag-progress-text">0 / 0</span>
            <button id="tag-cancel-btn" class="btn-sm btn-danger">Cancel</button>
        </div>
        <div class="progress-bar">
            <div id="tag-progress-fill" class="progress-fill"></div>
        </div>
        <div id="tag-current" class="text-dim"></div>
    </div>

    <!-- Session detail modal -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div id="detail-header" class="detail-header"></div>
            <div id="audio-player-container" class="audio-player-container"></div>
            <div id="voiceprint-bar" class="voiceprint-bar">
                <span id="voiceprint-selected-count">0 selected</span>
                <select id="voiceprint-speaker-select">
                    <option value="">-- Speaker --</option>
                    <option value="__new__">+ New Speaker...</option>
                </select>
                <div id="voiceprint-new-speaker" class="voiceprint-new-speaker hidden">
                    <input type="text" id="voiceprint-new-name" placeholder="Name">
                    <label class="toggle-label"><input type="checkbox" id="voiceprint-new-is-user"><span>Me</span></label>
                </div>
                <button id="voiceprint-add-btn" class="btn-sm" disabled>Add to voiceprint</button>
            </div>
            <div id="segment-filter-bar" class="segment-filter-bar hidden">
                <button class="seg-filter-btn active" data-filter="all">All</button>
                <button class="seg-filter-btn" data-filter="unknown-only">Unknown only</button>
                <button class="seg-filter-btn" data-filter="hide-unknown">Hide unknown</button>
            </div>
            <div id="segments-container" class="segments-container"></div>
        </div>
    </div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content settings-modal-content">
            <button class="modal-close" id="settings-close">&times;</button>
            <h2>Whisper Settings</h2>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="terms-tab">Term Corrections</button>
                <button class="tab" data-tab="suggestions-tab">LLM Suggestions <span id="suggestion-badge" class="badge hidden">0</span></button>
                <button class="tab" data-tab="hotwords-tab">Hotwords <span id="hotwords-badge" class="badge">0</span></button>
                <button class="tab" data-tab="voice-tab">Voice</button>
            </div>

            <!-- Term corrections tab -->
            <div id="terms-tab" class="tab-content active">
                <div class="term-add-row">
                    <input type="text" id="term-wrong" placeholder="Wrong (e.g. クーバネティス)">
                    <input type="text" id="term-correct" placeholder="Correct (e.g. Kubernetes)">
                    <button id="term-add-btn" class="btn-primary">Add</button>
                </div>
                <div class="term-search-row">
                    <input type="text" id="term-filter" placeholder="Filter...">
                    <span id="term-count" class="text-dim"></span>
                </div>
                <div id="terms-list" class="terms-list"></div>
            </div>

            <!-- LLM Suggestions tab -->
            <div id="suggestions-tab" class="tab-content">
                <div id="suggestions-list"></div>
            </div>

            <!-- Hotwords tab -->
            <div id="hotwords-tab" class="tab-content">
                <div class="hotwords-header">
                    <label class="toggle-label">
                        <input type="checkbox" id="hotwords-enabled" checked>
                        <span>Enable Hotwords</span>
                    </label>
                    <span id="hotwords-total-count" class="text-dim">0 active</span>
                </div>
                <div class="form-group">
                    <label>Max Total</label>
                    <input type="number" id="hotwords-max-total" min="10" max="2000" value="500" style="width:80px">
                </div>
                <div id="hotwords-categories" class="hotwords-categories"></div>
                <div class="hotwords-custom-section">
                    <label>Custom Hotwords</label>
                    <div class="term-add-row">
                        <input type="text" id="hotword-custom-input" placeholder="e.g. ほっともっと">
                        <button id="hotword-custom-add-btn" class="btn-primary">Add</button>
                    </div>
                    <div id="hotwords-custom-list" class="hotwords-custom-list"></div>
                </div>
                <button id="save-hotwords-settings" class="btn-primary">Save Settings</button>
                <span id="hotwords-status" class="save-status"></span>
            </div>

            <!-- Voice tab -->
            <div id="voice-tab" class="tab-content">
                <div class="voice-header">
                    <span id="voice-status-text" class="text-dim">0 speakers</span>
                </div>
                <div class="voice-add-row">
                    <input type="text" id="voice-name-input" placeholder="Speaker name (e.g. Taro)">
                    <label class="toggle-label">
                        <input type="checkbox" id="voice-is-user">
                        <span>Me</span>
                    </label>
                    <button id="voice-add-btn" class="btn-primary">Add Speaker</button>
                </div>
                <div id="voice-speakers-list" class="voice-speakers-list"></div>
                <div class="voice-threshold-row">
                    <label>Similarity Threshold</label>
                    <input type="range" id="voice-threshold" min="0.3" max="0.9" step="0.05" value="0.55">
                    <span id="voice-threshold-value">0.55</span>
                    <button id="voice-threshold-save" class="btn-sm">Save</button>
                </div>
                <div class="voice-actions">
                    <button id="voice-tag-btn" class="btn-primary">Tag All Recordings</button>
                    <button id="voice-delete-all-btn" class="btn-danger">Delete All Speakers</button>
                </div>
                <span id="voice-status" class="save-status"></span>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
